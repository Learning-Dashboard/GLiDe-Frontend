<mat-card class="card">
  <mat-card-header>
    <mat-card-title>Select user</mat-card-title>
  </mat-card-header>
  <mat-card-content>
    <div class="row">
      <div class="col">
        <mat-radio-group [(ngModel)]="selectedPlayer" (change)="onSubmit()">
          @for (res of result; track res) {
            <mat-radio-button color="primary" [value]="res.playername">{{ res.playername }}</mat-radio-button>
          }
        </mat-radio-group>
      </div>
    </div>
  </mat-card-content>
</mat-card>
